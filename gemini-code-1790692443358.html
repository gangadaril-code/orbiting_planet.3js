<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Chair Color Customizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      background-color: #1a1a1a;
      color: #ffffff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* UI Overlay Panel */
    .controls-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 20px;
      width: 280px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .controls-panel h2 {
      font-size: 1.1rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .controls-panel p {
      font-size: 0.8rem;
      color: #cccccc;
      margin-bottom: 16px;
    }

    .color-section {
      margin-bottom: 16px;
    }

    .color-section label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .swatches {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.15);
      border-color: #ffffff;
    }

    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
    }

    #loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #ffffff;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>

  <!-- Import Three.js and OrbitControls via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="loading-indicator">Loading Chair Model...</div>

  <div class="controls-panel">
    <h2>Chair Customizer</h2>
    <p>Click and drag to rotate the view. Scroll to zoom.</p>

    <div class="color-section">
      <label>Preset Colors:</label>
      <div class="swatches">
        <div class="swatch" style="background-color: #E49B64;" onclick="updateChairColor('#E49B64')"></div>
        <div class="swatch" style="background-color: #2D3748;" onclick="updateChairColor('#2D3748')"></div>
        <div class="swatch" style="background-color: #E53E3E;" onclick="updateChairColor('#E53E3E')"></div>
        <div class="swatch" style="background-color: #319795;" onclick="updateChairColor('#319795')"></div>
        <div class="swatch" style="background-color: #D69E2E;" onclick="updateChairColor('#D69E2E')"></div>
      </div>
    </div>

    <div class="color-picker-wrapper">
      <label for="customColor">Custom Color:</label>
      <input type="color" id="customColor" value="#E49B64">
    </div>
  </div>

    let scene, camera, renderer, controls;
    let chairMaterial = null;

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      // 2. Scene Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a1a);

      // 3. Camera Setup
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0.8, 0.8, 1.2);

      // 4. Renderer Setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // 5. Orbit Controls
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1; // Prevent going below floor line

      // 6. Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight1.position.set(2, 4, 2);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight2.position.set(-2, 2, -2);
      scene.add(dirLight2);

      // 7. Load GLB Model from Base64 Data URI
      const loader = new GLTFLoader();
      loader.load(CHAIR_GLB_DATA, (gltf) => {
        const model = gltf.scene;

        // Traverse model to target material for real-time recoloring
        model.traverse((child) => {
          if (child.isMesh) {
            // Convert unlit material into Standard PBR material for lighting interactions
            const oldMat = child.material;
            chairMaterial = new THREE.MeshStandardMaterial({
              color: oldMat.color ? oldMat.color : new THREE.Color('#E49B64'),
              roughness: 0.6,
              metalness: 0.1
            });
            child.material = chairMaterial;
          }
        });

        // Center model inside view
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        scene.add(model);
        controls.target.set(0, 0, 0);

        // Hide loading indicator once loaded
        const loaderEl = document.getElementById('loading-indicator');
        if (loaderEl) loaderEl.style.opacity = '0';
      });

      // 8. Handle Window Resize
      window.addEventListener('resize', onWindowResize);

      // 9. Setup Color Picker Event
      const colorPicker = document.getElementById('customColor');
      colorPicker.addEventListener('input', (e) => {
        updateChairColor(e.target.value);
      });

      // Start Animation Loop
      animate();
    }

    // Function to update chair material color dynamically
    window.updateChairColor = function(colorHex) {
      if (chairMaterial) {
        chairMaterial.color.set(colorHex);
      }
      document.getElementById('customColor').value = colorHex;
    };

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
